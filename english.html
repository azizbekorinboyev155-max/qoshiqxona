<script>
const LW={
A1:`about after again all always animal answer apple baby back bad bag beautiful because bed before big bird black blue body book boy bread brother brown but buy call can car cat chair child city class clean close cold color come cook cool day dog door drink eat egg eye face family father fast favorite fish food friend game girl give good great green hand happy have head hear help here home hot house how hungry jump kind know large last late learn like listen little live long look love make man many milk money morning mother music name need new night nice old open orange park people play please read red right room run sad school see sing sister sleep small smile song sun swim table tea teacher tell thank thing think time today tree walk want water white window woman work write year yellow young`,

C2:`aberration acquiesce ameliorate ascetic atrophy bucolic cacophony capitulate clandestine commiserate conflagration contrition cynosure demur dichotomy disconsolate ebullient effervescent ennui equanimity esoteric evanescent exacerbate fastidious fervor garrulous gossamer halcyon iconoclast ineffable insouciant intrepid lachrymose languor lethargy limpid loquacious magnanimous malaise mellifluous mercurial nefarious obfuscate palpable penumbra pernicious perfidious petrichor quixotic reverent sanguine sepulchral solipsism sonorous soporific spurious stoic surreptitious susurrus taciturn tenebrous torpor ubiquitous umbra vicissitude vociferous zenith`};
const stem=w=>{w=w.toLowerCase();for(const e of ['ing','ed','ies','es','ly','s']){if(w.length>e.length+2&&w.endsWith(e)){w=w.slice(0,-e.length);break}}if(w.length>3&&w.endsWith('e'))w=w.slice(0,-1);if(w.length>3&&w[w.length-1]===w[w.length-2])w=w.slice(0,-1);return w};
const LV={};let level='A1';try{level=localStorage.getItem('lvl_en')||'A1'}catch(e){}
for(const k in LW)LW[k].split(/\s+/).forEach(w=>{const t=stem(w);if(!LV[t])LV[t]=k});
function lvls(){const c=$('lv');c.innerHTML='';Object.keys(LW).forEach(k=>{const b=document.createElement('button');b.className='chip'+(k===level?' on':'');b.textContent=k;b.onclick=()=>{level=k;try{localStorage.setItem('lvl_en',k)}catch(e){}lvls();if(cur)build()};c.appendChild(b)})}
const $=id=>document.getElementById(id);
let songs=[],cur=null,blanks=[],au=new Audio(),playing=false,mem=[];
/* storage (Firebase REST) */
const KEY='AIzaSyAes3xk0l2MMRyMD1UvkK5fChVnbyDcn_E',DB='https://hor-mal-default-rtdb.firebaseio.com';
const SU='https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+KEY,TK='https://securetoken.googleapis.com/v1/token?key='+KEY;
let S=null,tok='',tokT=0;
const lsGet=()=>{try{return JSON.parse(localStorage.getItem('hm_s')||'null')}catch(e){return null}};
const lsSet=v=>{try{v?localStorage.setItem('hm_s',JSON.stringify(v)):localStorage.removeItem('hm_s')}catch(e){}};
async function token(){if(Date.now()<tokT)return tok;const r=await fetch(TK,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(S.rt)});const j=await r.json();if(!j.id_token)throw new Error('auth');tok=j.id_token;tokT=Date.now()+3300000;if(j.refresh_token&&j.refresh_token!==S.rt){S.rt=j.refresh_token;lsSet(S)}return tok}
async function api(p,m,b){const t=await token();const r=await fetch(DB+p+'.json?auth='+t,{method:m||'GET',body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw new Error(String(r.status));return r.json()}
async function all(){const o=S.admin?{}:(await api('/users/'+S.uid+'/songs_en')||{});let sh={};try{sh=await api('/en_shared/songs')||{}}catch(e){}return [...Object.values(o),...Object.values(sh)].sort((a,b)=>(a.t||0)-(b.t||0))}
const sp=s=>(S.admin||s.shared)?'/en_shared/songs/'+s.id:'/users/'+S.uid+'/songs_en/'+s.id;
async function put(s){s.t=s.t||Date.now();if(S.admin)s.shared=1;try{await api(sp(s),'PUT',s)}catch(e){alert('Saqlab bo\u02bblmadi \u2014 kirish yopilgan yoki internet yo\u02bbq')}}
async function rm(s){try{await api(sp(s),'DELETE')}catch(e){}}
const msg=m=>{$('lM').textContent=m};
function showLogin(m){$('app').style.display='none';$('login').style.display='grid';msg(m||'')}
async function boot(){S=lsGet();if(!S||!S.rt){showLogin();return}
try{await token();if(!S.admin)await api('/users/'+S.uid+'/profile');start()}catch(e){if(e.message==='401'||e.message==='auth'){lsSet(null);S=null;showLogin('Kirish yopilgan yoki kod bekor qilingan. Murojaat uchun pastdagi aloqadan foydalaning.')}else showLogin('Internet bilan muammo. Sahifani yangilab qayta urinib ko\u02bbring.')}}
async function login(){const name=$('lN').value.trim(),code=$('lC').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
if(name.toLowerCase()==='azizbek'&&code.length<8){return adminLogin($('lC').value)}
if(!name||code.length<8){msg('Ism va kodni to\u02bbliq kiriting');return}
$('lB').disabled=true;msg('Tekshirilmoqda...');
try{const r=await fetch(SU,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});const j=await r.json();if(!j.idToken)throw new Error('signup');
S={rt:j.refreshToken,uid:j.localId,name,code};tok=j.idToken;tokT=Date.now()+3300000;
const c=await fetch(DB+'/codes/'+code+'.json?auth='+tok,{method:'PATCH',body:JSON.stringify({uid:S.uid,name,usedAt:Date.now()})});
if(!c.ok){S=null;msg('Kod noto\u02bbg\u02bbri, ishlatilgan yoki bekor qilingan.');$('lB').disabled=false;return}
await api('/members/'+S.uid,'PUT',code);await api('/users/'+S.uid+'/profile','PUT',{name});lsSet(S);start()}catch(e){S=null;msg('Xatolik: internetni tekshirib, qayta urinib ko\u02bbring.')}
$('lB').disabled=false}
/* admin */
const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',fmt=c=>c.slice(0,5)+'-'+c.slice(5);
const genCode=()=>{const a=new Uint32Array(10);crypto.getRandomValues(a);return [...a].map(x=>AL[x%AL.length]).join('')};
async function adminLogin(pw){const E='azizbek@listenup.app',U='https://identitytoolkit.googleapis.com/v1/accounts:',H={'Content-Type':'application/json'},B=JSON.stringify({email:E,password:pw,returnSecureToken:true});
$('lB').disabled=true;msg('Tekshirilmoqda...');
try{let j=await(await fetch(U+'signInWithPassword?key='+KEY,{method:'POST',headers:H,body:B})).json();
if(j.error&&j.error.message==='EMAIL_NOT_FOUND')j=await(await fetch(U+'signUp?key='+KEY,{method:'POST',headers:H,body:B})).json();
if(!j.idToken){const m=j.error?j.error.message:'';msg(m==='OPERATION_NOT_ALLOWED'?'Firebase’da Email/Password kirish yoqilmagan.':m.startsWith('WEAK')?'Parol juda qisqa (kamida 6 belgi).':'Admin paroli noto‘g‘ri.');$('lB').disabled=false;return}
S={rt:j.refreshToken,uid:j.localId,name:'Azizbek',admin:true};tok=j.idToken;tokT=Date.now()+3300000;lsSet(S);start()}
catch(e){msg('Xatolik: internetni tekshiring.')}$('lB').disabled=false}
async function codes(){const L=$('aL');let o;try{o=await api('/codes')||{}}catch(e){L.textContent='Kodlarni oʻqib boʻlmadi — Firebase qoidalariga admin ruxsatini qoʻshing.';return}
const ks=Object.keys(o).sort((a,b)=>(o[b].created||0)-(o[a].created||0));L.innerHTML='';
if(!ks.length){L.textContent='Hozircha kod yoʻq';return}
const h=document.createElement('div');h.className='mu';h.textContent='Jami '+ks.length+' ta, ishlatilgan '+ks.filter(k=>o[k].uid).length+' ta';L.appendChild(h);
ks.forEach(k=>{const c=o[k],r=document.createElement('div');r.className='row';r.style.cssText='justify-content:space-between;border-top:1px solid var(--bd);padding:6px 0';
const b=document.createElement('b');b.textContent=fmt(k);b.style.fontFamily='monospace';
const t=document.createElement('span');t.className='mu';t.style.flex='1';t.textContent=c.uid?'✓ '+(c.name||'')+(c.usedAt?' · '+new Date(c.usedAt).toLocaleDateString():''):'boʻsh'+(c.note?' · '+c.note:'');
const cp=document.createElement('button');cp.className='chip';cp.textContent='Nusxa';cp.onclick=async()=>{try{await navigator.clipboard.writeText(fmt(k));cp.textContent='✓'}catch(e){prompt('Kod:',fmt(k))}setTimeout(()=>cp.textContent='Nusxa',1200)};
const d=document.createElement('button');d.className='chip';d.textContent='Oʻchirish';d.onclick=async()=>{if(confirm(fmt(k)+' kodi oʻchirilsinmi? Foydalanuvchi kirishdan chiqib ketadi.')){try{await api('/codes/'+k,'DELETE')}catch(e){alert('Oʻchirib boʻlmadi')}codes()}};
r.append(b,t,cp,d);L.appendChild(r)})}
$('aG').onclick=async()=>{const n=+$('aC').value,note=$('aN').value.trim(),o={};for(let i=0;i<n;i++)o[genCode()]={created:Date.now()+i,note};
try{await api('/codes','PATCH',o);$('aN').value=''}catch(e){alert('Kod yaratib boʻlmadi — Firebase qoidalarini tekshiring')}codes()};
$('out').onclick=()=>{lsSet(null);location.reload()};
$('lN').oninput=()=>{$('lC').type=$('lN').value.trim().toLowerCase()==='azizbek'?'password':'text'};
/* ui */
function list(){const c=$('songs');c.innerHTML=songs.length?'':'<span class="mu">Hozircha qo\u02bbshiq yo\u02bbq \u2014 yuqoridagi shakl orqali qo\u02bbshing</span>';songs.slice().reverse().forEach(s=>{const b=document.createElement('button');b.className='sc';const t=document.createElement('b');t.textContent=s.title;const a=document.createElement('span');a.textContent=(s.artist||'')+(s.shared?' · umumiy':'');b.append(t,a);b.onclick=()=>open(s);c.appendChild(b)})}
function stop(){au.pause();ytCmd('pauseVideo');playing=false;$('pp').textContent='▶ Boshlash'}
function open(s){stop();cur=s;list();try{history.replaceState(null,'','#'+s.id)}catch(e){}$('play').classList.remove('hid');$('home').classList.add('hid');window.scrollTo(0,0);$('pT').textContent=s.title;$('pA').textContent=s.artist?'— '+s.artist:'';
const y=$('pY');if(s.yt){y.href=s.yt;y.classList.remove('hid')}else y.classList.add('hid');
$('del').classList.toggle('hid',!!s.shared&&!S.admin);
const vid=ytId(s.yt),fr=$('yt');if(vid){fr.src='https://www.youtube-nocookie.com/embed/'+vid+'?enablejsapi=1&playsinline=1&rel=0';fr.classList.remove('hid')}else{fr.removeAttribute('src');fr.classList.add('hid')}
$('demoNote').textContent='';
if(s.blob)au.src=URL.createObjectURL(s.blob);
build()}
function build(){const lines=cur.lyrics.split('\n').map(l=>l.trim()).filter(Boolean);
const re=/[A-Za-z]+(?:['’][A-Za-z]+)*/g,idx=Object.keys(LW),li=idx.indexOf(level),cand=[];
lines.forEach((l,i)=>{[...l.matchAll(re)].forEach(x=>{const w=x[0],lv=LV[stem(w)];if(w.length<3||(w.length<4&&!lv))return;const d=lv?Math.abs(idx.indexOf(lv)-li):9;x.lv=lv;if(d===0||fillOn())cand.push({i,x,d,r:Math.random()})})});
let pick=[];const used=new Set();
[...new Set(cand.map(c=>c.d))].sort((p,q)=>p-q).forEach(d=>{const t=cand.filter(c=>c.d===d).sort((p,q)=>p.r-q.r);
t.forEach(c=>{if(pick.length<12&&!used.has(c.i)){pick.push(c);used.add(c.i)}});
t.forEach(c=>{if(pick.length<12&&!pick.includes(c))pick.push(c)})});
$('cnt').textContent=pick.length+' ta bo\u02bbshliq'+(fillOn()?' ('+pick.filter(p=>p.d===0).length+' tasi '+level+')':(pick.length<12?' \u2014 matnda '+level+' darajasi shuncha':''));const by={};pick.forEach(p=>(by[p.i]=by[p.i]||[]).push(p.x));
const box=$('lyr');box.innerHTML='';blanks=[];$('sc').textContent='';
lines.forEach((l,i)=>{const d=document.createElement('div');let pos=0;(by[i]||[]).sort((a,b)=>a.index-b.index).forEach(x=>{d.append(l.slice(pos,x.index));const inp=document.createElement('input');inp.type='text';inp.placeholder=x.lv&&x.lv!==level?x.lv:'';inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;inp.style.width=Math.max(4,x[0].length+2)+'ch';d.appendChild(inp);blanks.push({inp,w:x[0]});pos=x.index+x[0].length});d.append(l.slice(pos));box.appendChild(d)})}
const norm=s=>s.trim().toLowerCase().replace(/[’‘]/g,"'");
$('ck').onclick=()=>{let ok=0;blanks.forEach(b=>{const r=norm(b.inp.value)===norm(b.w);b.inp.className=r?'ok':(b.inp.value?'no':'');if(r)ok++});$('sc').textContent=ok+' / '+blanks.length+(ok===blanks.length?' 🎉':'')};
$('sh').onclick=()=>{blanks.forEach(b=>{b.inp.value=b.w;b.inp.className='ok'});$('sc').textContent=''};
$('nw').onclick=build;
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const a=document.activeElement;if(a&&a.tagName==='INPUT'&&a.type==='text'&&a.closest('#lyr')){const p=a.selectionStart;a.setRangeText(b.dataset.c,p,a.selectionEnd,'end');a.focus()}});
function ytId(u){const m=(u||'').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:''}
function ytCmd(f,a){const fr=$('yt');try{fr.contentWindow&&fr.contentWindow.postMessage(JSON.stringify({event:'command',func:f,args:a||[]}),'*')}catch(e){}}
/* playback */
function say(){const u=new SpeechSynthesisUtterance(cur.lyrics.replace(/\n/g,'. '));u.lang='en-US';u.rate=.8*parseFloat($('sp').value);u.onend=()=>{playing=false;$('pp').textContent='▶ Boshlash'};speechSynthesis.cancel();speechSynthesis.speak(u)}
$('pp').onclick=()=>{if(!cur)return;if(playing){stop();return}
if(cur.blob){au.playbackRate=parseFloat($('sp').value);au.play()}else{ytCmd('setPlaybackRate',[parseFloat($('sp').value)]);ytCmd('playVideo')}playing=true;$('pp').textContent='⏸ Toʻxtatish'};
$('rs').onclick=()=>{if(!cur)return;if(cur.blob){au.currentTime=0}else{ytCmd('seekTo',[0,true])}};
$('sp').onchange=()=>{const v=parseFloat($('sp').value);au.playbackRate=v;ytCmd('setPlaybackRate',[v])};
au.onended=()=>{playing=false;$('pp').textContent='▶ Boshlash'};
/* add song */


$('save').onclick=async()=>{const t=$('fT').value.trim(),l=$('fL').value.trim();if(!t||!l){alert('Nomi va matnni toʻldiring');return}if(!ytId($('fY').value)){alert('Toʻgʻri YouTube havolasini kiriting');return}
const f=null;const s={id:'s'+Date.now(),title:t,artist:$('fA').value.trim(),yt:$('fY').value.trim(),lyrics:l,blob:f||null};
await put(s);songs.push(s);['fT','fA','fY','fL'].forEach(i=>$(i).value='');open(s)};
$('del').onclick=async()=>{if(cur&&confirm('Oʻchirilsinmi?')){await rm(cur);songs=songs.filter(x=>x.id!==cur.id);stop();$('play').classList.add('hid');$('del').classList.add('hid');$('home').classList.remove('hid');cur=null;list()}};
lvls();
async function start(){$('login').style.display='none';$('app').style.display='grid';$('who').textContent=S.name+(S.admin?' (admin)':'');if(S.admin){$('adm').classList.remove('hid');codes()}try{songs=await all()}catch(e){songs=[]}list();const id=location.hash.slice(1),f=songs.find(x=>x.id===id);if(f)open(f);setInterval(async()=>{try{const n=await all();if(n.length!==songs.length){songs=n;if(!cur)list()}}catch(e){}},20000)}
const fillOn=()=>$('fill').checked;$('fill').onchange=()=>{if(cur)build()};
$('back').onclick=()=>{stop();$('play').classList.add('hid');$('del').classList.add('hid');$('home').classList.remove('hid');cur=null;list();try{history.replaceState(null,'',location.pathname)}catch(e){}};
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('cp').textContent='\u2713 Nusxalandi'}catch(e){prompt('Havola:',location.href)}setTimeout(()=>$('cp').textContent='🔗 Havolani nusxalash',1500)};
$('lB').onclick=login;$('lC').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
boot();
</script></body></html>
